<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공개 스프레드시트 일정 테스트</title>
<style>
body{font-family:system-ui,sans-serif;padding:24px;line-height:1.6}
pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:12px}
</style>
</head>
<body>
<h1>공개 스프레드시트 일정 테스트</h1>
<p>Programs 시트가 공개 읽기 가능하면 아래에 일정 데이터가 표시됩니다.</p>
<pre id="out">불러오는 중...</pre>
<script src="./config.js?v=friendly20260629"></script>
<script>
const out=document.getElementById('out');
const cfg=window.APP_CONFIG||{};
const cb='testcb_'+Date.now();
window[cb]=function(response){
  if(!response || response.status==='error'){
    out.textContent='실패: 스프레드시트가 웹에 게시되지 않았거나 공개 읽기 권한이 없습니다.\n\n' + JSON.stringify(response,null,2);
    return;
  }
  out.textContent=JSON.stringify(response.table.rows.slice(0,5),null,2);
};
const s=document.createElement('script');
s.onerror=function(){out.textContent='실패: 스크립트 로드 실패';};
s.src='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(cfg.PROGRAMS_SHEET_ID)+'/gviz/tq?sheet='+encodeURIComponent(cfg.PROGRAMS_SHEET_NAME||'Programs')+'&tqx=responseHandler:'+cb+';out:json&v='+Date.now();
document.body.appendChild(s);
</script>
</body>
</html>
