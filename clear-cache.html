<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>앱 캐시 초기화</title>
  <style>
    body {
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#0e1f24;
      color:white;
      padding:24px;
      text-align:center;
    }
    .card {
      max-width:520px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.16);
      border-radius:28px;
      padding:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }
    h1 { margin:0 0 12px; font-size:28px; }
    p { color:#d9eceb; line-height:1.6; }
    a {
      display:inline-block;
      margin-top:14px;
      padding:14px 18px;
      border-radius:16px;
      background:#7fffee;
      color:#0e1f24;
      font-weight:900;
      text-decoration:none;
    }
    #log { margin-top:16px; color:#b6d540; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>앱 캐시 초기화 중</h1>
    <p>예전 파일을 삭제하고 최신 앱으로 다시 이동합니다.<br>개인 일정 데이터는 삭제하지 않습니다.</p>
    <div id="log">처리 중...</div>
    <a href="./?v=cachefix20260629">바로 앱으로 이동</a>
  </div>

  <script>
    const log = document.getElementById('log');

    async function resetCache() {
      const messages = [];

      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
          }
          messages.push('서비스워커 삭제 완료');
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
          messages.push('캐시 삭제 완료');
        }

        messages.push('최신 앱으로 이동합니다.');
        log.textContent = messages.join('\n');

        setTimeout(() => {
          location.replace('./?v=cachefix20260629');
        }, 900);
      } catch (err) {
        log.textContent = '초기화 중 오류가 발생했습니다. 아래 버튼으로 이동해주세요.\n' + err.message;
      }
    }

    resetCache();
  </script>
</body>
</html>
